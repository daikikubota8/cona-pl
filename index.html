<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CONA / ナポリマン 統合管理ダッシュボード</title>
<style>
  :root{ --bg:#f7f5f1; --line:#e1ddd3; --wine:#8b2635; --gold:#a9791b; --text:#262320; --text-dim:#6b6558; }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;height:100%;}
  body{
    background:var(--bg); color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP",sans-serif;
    display:flex; flex-direction:column; min-height:100vh;
  }
  .switcher{
    position:sticky; top:0; z-index:50;
    background:linear-gradient(120deg,#1b1a17,#2b2722);
    border-bottom:1px solid var(--line);
    padding:12px 20px; display:flex; align-items:center; gap:18px; flex-wrap:wrap;
  }
  .switcher .brand{ color:#fff; font-weight:800; font-size:15px; }
  .switcher .brand small{
    display:block; font-weight:500; font-size:11px; color:#c9c3b6; letter-spacing:.14em; text-transform:uppercase;
  }
  .seg{
    display:inline-flex; background:rgba(255,255,255,.08); border:1px solid rgba(255,255,255,.14);
    border-radius:999px; padding:4px; gap:4px;
  }
  .seg button{
    border:none; background:transparent; color:#e7e2d7; font-weight:700; font-size:13.5px;
    padding:9px 18px; border-radius:999px; cursor:pointer; transition:all .16s ease; white-space:nowrap;
  }
  .seg button:hover{ color:#fff; }
  .seg button.active[data-view="pl"]{ background:var(--wine); color:#fff; box-shadow:0 2px 8px rgba(139,38,53,.4); }
  .seg button.active[data-view="shussu"]{ background:#2563eb; color:#fff; box-shadow:0 2px 8px rgba(37,99,235,.4); }
  .seg button.active[data-view="brand"]{ background:var(--gold); color:#fff; box-shadow:0 2px 8px rgba(169,121,27,.4); }
  .switcher .hint{ margin-left:auto; color:#b7b1a4; font-size:11.5px; }
  .stage{ position:relative; flex:1 1 auto; width:100%; }
  .stage iframe{
    position:absolute; inset:0; width:100%; height:100%; border:0; display:block; background:var(--bg);
  }
  .stage iframe.hidden{ display:none; }
  @media(max-width:680px){
    .switcher{ gap:12px; padding:10px 14px; }
    .switcher .hint{ display:none; }
    .seg button{ padding:8px 12px; font-size:12px; }
  }
</style>
</head>
<body>
  <div class="switcher">
    <div class="brand"><span>CONA / ナポリマン<small>Integrated Management Dashboard</small></span></div>
    <div class="seg" id="seg">
      <button class="active" data-view="brand">ブランド理念</button>
      <button data-view="pl">店舗PL・QSC管理</button>
      <button data-view="shussu">店舗出数管理</button>
    </div>
    <span class="hint">上のボタンで各ダッシュボードを切り替えられます</span>
  </div>
  <div class="stage">
    <iframe id="frame-pl"     title="店舗PL・QSC管理ダッシュボード"></iframe>

    <iframe id="frame-brand"  class="hidden" title="ブランド理念"></iframe>
  </div>

  function decodeUtf8B64(b64){
    var bin = atob(b64);
    var bytes = new Uint8Array(bin.length);
    for(var i=0;i<bin.length;i++){ bytes[i] = bin.charCodeAt(i); }
    return new TextDecoder('utf-8').decode(bytes);
  }
  var frames = {
    pl: document.getElementById('frame-pl'),
    shussu: document.getElementById('frame-shussu'),
    brand: document.getElementById('frame-brand')
  };
  var loaded = { pl:false, shussu:false, brand:false };
  function ensureLoaded(view){
    if(loaded[view]) return;
    frames[view].srcdoc = decodeUtf8B64(B64[view]);
    loaded[view] = true;
  }
  function show(view){
    ensureLoaded(view);
    for(var k in frames){
      frames[k].classList.toggle('hidden', k !== view);
    }
    var btns = document.querySelectorAll('#seg button');
    for(var i=0;i<btns.length;i++){
      btns[i].classList.toggle('active', btns[i].getAttribute('data-view') === view);
    }
  }
  document.getElementById('seg').addEventListener('click', function(e){
    var b = e.target.closest('button[data-view]');
    if(!b) return;
    show(b.getAttribute('data-view'));
  });
  show('brand');
</script>
