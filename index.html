<style>
  :root{
    --bg:#f7f5f1;
    --surface:#ffffff;
    --surface2:#f1eee7;
    --line:#e1ddd3;
    --wine:#8b2635;
    --wine-light:#a8324a;
    --tomato:#c1440e;
    --tomato-light:#b8410f;
    --gold:#a9791b;
    --text:#262320;
    --text-dim:#6b6558;
    --good:#2f7a4f;
    --bad:#b8410f;
  }
  *{box-sizing:border-box;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:'Inter',sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .font-display{font-family:'Fraunces',serif;}
  .font-mono{font-family:'IBM Plex Mono',monospace;}
  .surface{background:var(--surface); border:1px solid var(--line); box-shadow:0 1px 3px rgba(38,35,32,.05);}
  .surface2{background:var(--surface2); border:1px solid var(--line);}
  .rack-divider{
    background-image:repeating-linear-gradient(90deg, var(--line) 0px, var(--line) 1px, transparent 1px, transparent 14px);
    height:1px;
  }
  ::-webkit-scrollbar{height:8px; width:8px;}
  ::-webkit-scrollbar-thumb{background:var(--line); border-radius:4px;}
  ::-webkit-scrollbar-track{background:transparent;}
  .tab-btn{
    position:relative; padding:.6rem 1.1rem; border-radius:.6rem; font-weight:600; font-size:.9rem;
    color:var(--text-dim); transition:all .15s ease; cursor:pointer; white-space:nowrap;
  }
  .tab-btn:hover{color:var(--text); background:var(--surface2);}
  .tab-btn.active{color:#fff;}
  .tab-btn.active[data-brand="overview"]{background:var(--gold); color:#14171c;}
  .tab-btn.active[data-brand="CONA"]{background:var(--wine);}
  .tab-btn.active[data-brand="NAPOLIMAN"]{background:var(--tomato);}
  .tab-btn.active[data-brand="yoy"]{background:#3f6a8f;}
  input[type="text"], input[type="number"], input[type="month"], select{
    background:var(--surface2); border:1px solid var(--line); color:var(--text);
    border-radius:.5rem; padding:.5rem .7rem; font-size:.875rem; width:100%;
    outline:none; transition:border-color .15s;
  }
  input:focus, select:focus{border-color:var(--gold);}
  input::placeholder{color:#a39c8c;}
  .sim-slider{
    -webkit-appearance:none; appearance:none; width:100%; height:6px; border-radius:999px;
    background:var(--surface2); accent-color:var(--gold); cursor:pointer;
  }
  .sim-slider::-webkit-slider-thumb{
    -webkit-appearance:none; appearance:none; width:18px; height:18px; border-radius:50%;
    background:var(--gold); border:2px solid #fff; box-shadow:0 1px 3px rgba(0,0,0,.25); cursor:pointer;
  }
  .sim-slider::-moz-range-thumb{
    width:18px; height:18px; border-radius:50%; background:var(--gold); border:2px solid #fff; cursor:pointer;
  }
  .pill{
    padding:.4rem .9rem; border-radius:999px; font-size:.82rem; font-weight:600;
    border:1px solid var(--line); color:var(--text-dim); cursor:pointer; transition:all .15s; white-space:nowrap;
  }
  .pill:hover{border-color:var(--gold); color:var(--text);}
  .pill.selected-CONA{background:var(--wine); color:#fff; border-color:var(--wine);}
  .pill.selected-NAPOLIMAN{background:var(--tomato); color:#fff; border-color:var(--tomato);}
  .badge-high{background:rgba(184,65,15,.1); color:var(--tomato-light); border:1px solid rgba(184,65,15,.3);}
  .badge-mid{background:rgba(169,121,27,.12); color:var(--gold); border:1px solid rgba(169,121,27,.35);}
  .btn-primary{
    background:var(--gold); color:#fff; font-weight:700; padding:.6rem 1.2rem; border-radius:.6rem;
    font-size:.875rem; transition:filter .15s; cursor:pointer; border:none;
  }
  .btn-primary:hover{filter:brightness(1.08);}
  .btn-ghost{
    background:transparent; color:var(--text-dim); font-weight:600; padding:.5rem .9rem; border-radius:.5rem;
    font-size:.82rem; border:1px solid var(--line); cursor:pointer; transition:all .15s;
  }
  .btn-ghost:hover{color:var(--text); border-color:var(--text-dim);}
  table{width:100%; border-collapse:collapse; font-size:.83rem;}
  th, td{padding:.55rem .7rem; text-align:right; white-space:nowrap;}
  th{color:var(--text-dim); font-weight:600; text-align:right; border-bottom:1px solid var(--line);}
  th:first-child, td:first-child{text-align:left; position:sticky; left:0; background:var(--surface); }
  tbody tr:not(:last-child) td{border-bottom:1px solid var(--line);}
  .up{color:var(--good);}
  .down{color:var(--bad);}
  .fade-in{animation:fadeIn .25s ease;}
  @keyframes fadeIn{from{opacity:0; transform:translateY(4px);} to{opacity:1; transform:translateY(0);}}
  @media (prefers-reduced-motion: reduce){ .fade-in{animation:none;} }
</style>

      delete parsed[b].data[s];

/* ============================= ユーティリティ ============================= */
function yen(v){
  if(v === null || v === undefined || isNaN(v)) return '—';
  return '¥' + Math.round(v).toLocaleString('ja-JP');
}
function pct(v, digits=1){
  if(v === null || v === undefined || isNaN(v)) return '—';
  const s = v >= 0 ? '+' : '';
  return s + v.toFixed(digits) + '%';
}
function pt(v, digits=1){
  if(v === null || v === undefined || isNaN(v)) return '—';
  const s = v >= 0 ? '+' : '';
  return s + v.toFixed(digits) + 'pt';
}
function monthLabel(ym){
  if(!ym) return '—';
  const [y,m] = ym.split('-');
  return `${y}年${parseInt(m,10)}月`;
}
function sortedMonths(storeData){
  return Object.keys(storeData || {}).sort();
}
function computeProfit(entry){
  if(!entry) return null;
  return entry.sales - (entry.food + entry.labor + entry.rent + entry.other);
}
function metricValue(entry, key){
  if(!entry) return null;
  if(key === 'profit') return computeProfit(entry);
  return entry[key];
}
function pctChange(cur, prev){
  if(cur === null || prev === null || prev === undefined || cur === undefined || prev === 0) return null;
  return ((cur - prev) / Math.abs(prev)) * 100;
}

/* ============================= アラート生成（総評） ============================= */
function generateAlerts(){
  const alerts = [];
  for(const brandKey of Object.keys(BRAND_META)){
    const brand = state.data[brandKey];
    for(const store of brand.stores){
      const storeData = brand.data[store] || {};
      const months = sortedMonths(storeData);
      if(months.length < 2) continue;
      const latest = months[months.length - 1];
      const prev1 = months[months.length - 2];
      const prev2 = months.length >= 3 ? months[months.length - 3] : null;
      const eLatest = storeData[latest];
      const ePrev1 = storeData[prev1];
      const ePrev2 = prev2 ? storeData[prev2] : null;

      // 絶対値項目（売上・費用・利益）
      for(const key of Object.keys(METRIC_LABELS)){
        const cur = metricValue(eLatest, key);
        const isCost = COST_KEYS.includes(key);
        [['前月比', ePrev1, prev1], ['前々月比', ePrev2, prev2]].forEach(([label, ePrev, ym])=>{
          if(!ePrev) return;
          const prevVal = metricValue(ePrev, key);
          const change = pctChange(cur, prevVal);
          if(change === null || Math.abs(change) < RATE_THRESHOLD) return;
          const bad = isCost ? change > 0 : change < 0; // コストは増加が悪化、売上・利益は減少が悪化
          alerts.push({
            brand: brandKey, store, month: latest, label,
            title: `${METRIC_LABELS[key]}が${label} ${pct(change)}`,
            detail: `${monthLabel(ym)} ${yen(prevVal)} → ${monthLabel(latest)} ${yen(cur)}`,
            severity: Math.abs(change) >= 15 ? '高' : '中',
            bad, absChange: Math.abs(change), metricKey: key,
            entry: eLatest, prevEntry: ePrev, storeName: store
          });
        });
      }

      // 比率項目（食材費率・人件費率）
      const ratioDefs = [ {key:'food', label:'食材費率'}, {key:'labor', label:'人件費率'} ];
      ratioDefs.forEach(({key,label})=>{
        const curRatio = eLatest && eLatest.sales ? (eLatest[key] / eLatest.sales * 100) : null;
        [['前月比', ePrev1, prev1], ['前々月比', ePrev2, prev2]].forEach(([lbl, ePrev, ym])=>{
          if(!ePrev || !ePrev.sales || curRatio === null) return;
          const prevRatio = ePrev[key] / ePrev.sales * 100;
          const diff = curRatio - prevRatio;
          if(Math.abs(diff) < RATIO_THRESHOLD) return;
          alerts.push({
            brand: brandKey, store, month: latest, label: lbl,
            title: `${label}が${lbl} ${pt(diff)}`,
            detail: `${monthLabel(ym)} ${prevRatio.toFixed(1)}% → ${monthLabel(latest)} ${curRatio.toFixed(1)}%`,
            severity: Math.abs(diff) >= 4 ? '高' : '中',
            bad: diff > 0, absChange: Math.abs(diff), metricKey: key + 'Ratio',
            entry: eLatest, prevEntry: ePrev, storeName: store
          });
        });
      });

      // その他経費の内訳項目（広告費・水道光熱費など）ごとのアラート
      Object.keys(OTHER_BREAKDOWN_LABELS).forEach(bKey=>{
        if(!eLatest.otherBreakdown) return;
        const cur = eLatest.otherBreakdown[bKey];
        if(cur === undefined || cur === null) return;
        [['前月比', ePrev1, prev1], ['前々月比', ePrev2, prev2]].forEach(([label, ePrev, ym])=>{
          if(!ePrev || !ePrev.otherBreakdown) return;
          const prevVal = ePrev.otherBreakdown[bKey];
          if(prevVal === undefined || prevVal === null) return;
          const diff = cur - prevVal;
          const change = pctChange(cur, prevVal);
          const bigEnough = Math.abs(diff) >= 20000; // 2万円未満の変動はノイズとして無視
          const percentTrigger = change !== null && Math.abs(change) >= 30 && bigEnough;
          const absoluteTrigger = Math.abs(diff) >= 150000; // 15万円以上は率にかかわらず検出
          if(!percentTrigger && !absoluteTrigger) return;
          const pctText = change !== null ? `（${pct(change)}）` : '（新規発生/大幅変動）';
          alerts.push({
            brand: brandKey, store, month: latest, label,
            title: `${OTHER_BREAKDOWN_LABELS[bKey]}が${label} ${diff>=0?'+':''}${yen(diff)}${pctText}`,
            detail: `${monthLabel(ym)} ${yen(prevVal)} → ${monthLabel(latest)} ${yen(cur)}`,
            severity: (Math.abs(diff) >= 150000 || (change!==null && Math.abs(change)>=60)) ? '高' : '中',
            bad: diff > 0, absChange: change !== null ? Math.abs(change) : 50, metricKey: bKey,
            entry: eLatest, prevEntry: ePrev, storeName: store
          });
        });
      });
    }
  }
  alerts.sort((a,b)=> b.absChange - a.absChange);
  return alerts;
}

/* ============================= コメント生成（根拠ベース） ============================= */
function topBreakdownDriver(entry, prevEntry){
  if(!entry || !prevEntry || !entry.otherBreakdown || !prevEntry.otherBreakdown) return null;
  let maxKey = null, maxDiff = 0;
  Object.keys(OTHER_BREAKDOWN_LABELS).forEach(k=>{
    const diff = (entry.otherBreakdown[k]||0) - (prevEntry.otherBreakdown[k]||0);
    if(Math.abs(diff) > Math.abs(maxDiff)){ maxDiff = diff; maxKey = k; }
  });
  return maxKey && Math.abs(maxDiff) > 0 ? { key:maxKey, diff:maxDiff } : null;
}
function topProfitDriver(entry, prevEntry){
  if(!entry || !prevEntry) return null;
  const deltaProfit = computeProfit(entry) - computeProfit(prevEntry);
  const contributions = {
    '売上': entry.sales - prevEntry.sales,
    '食材費': -(entry.food - prevEntry.food),
    '人件費': -(entry.labor - prevEntry.labor),
    '家賃': -(entry.rent - prevEntry.rent),
    'その他経費': -(entry.other - prevEntry.other),
  };
  // 利益の増減方向と同じ向きの要因の中から、最も影響が大きいものを選ぶ
  const entries = Object.entries(contributions);
  const aligned = entries.filter(([,v]) => deltaProfit >= 0 ? v > 0 : v < 0);
  const pool = aligned.length ? aligned : entries;
  let maxKey = null, maxVal = 0;
  pool.forEach(([k,v])=>{
    if(Math.abs(v) > Math.abs(maxVal)){ maxVal = v; maxKey = k; }
  });
  return maxKey ? { label:maxKey, value:maxVal } : null;
}
function commentFor(alert, allAlerts){
  const { metricKey, entry, prevEntry, storeName } = alert;
  const targets = getTargets(storeName);

  if(metricKey === 'food' || metricKey === 'foodRatio'){
    if(!targets || !entry.sales) return null;
    const ratio = entry.food / entry.sales * 100;
    const diff = ratio - targets.food;
    if(Math.abs(diff) < 0.1) return null;
    const yenImpact = Math.abs(diff)/100 * entry.sales;
    return `食材費率は${ratio.toFixed(1)}%で、目標${targets.food}%を${diff>=0?'+':''}${diff.toFixed(1)}pt${diff>=0?'超過':'下回って'}おり、月商換算で約${yen(yenImpact)}の${diff>=0?'コスト増':'コスト減'}に相当します。`;
  }
  if(metricKey === 'labor' || metricKey === 'laborRatio'){
    if(!targets || !entry.sales) return null;
    const ratio = entry.labor / entry.sales * 100;
    const diff = ratio - targets.labor;
    if(Math.abs(diff) < 0.1) return null;
    const yenImpact = Math.abs(diff)/100 * entry.sales;
    return `人件費率は${ratio.toFixed(1)}%で、目標${targets.labor}%を${diff>=0?'+':''}${diff.toFixed(1)}pt${diff>=0?'超過':'下回って'}おり、月商換算で約${yen(yenImpact)}の${diff>=0?'コスト増':'コスト減'}に相当します。`;
  }
  if(metricKey === 'other'){
    const drv = topBreakdownDriver(entry, prevEntry);
    if(!drv) return '内訳データが無いため主因は特定できません。「その他経費」内訳をご確認ください。';
    return `その他経費の内訳では${OTHER_BREAKDOWN_LABELS[drv.key]}が前月比${drv.diff>=0?'+':''}${yen(drv.diff)}と最も大きく変化しており、主因と考えられます。`;
  }
  if(metricKey === 'profit'){
    const drv = topProfitDriver(entry, prevEntry);
    if(!drv) return null;
    return `${drv.label}の変化（${drv.value>=0?'+':''}${yen(drv.value)}）が利益変動の主因です。`;
  }
  if(metricKey === 'rent'){
    return `家賃は通常固定費のため、契約更新・増床・改装などの特殊要因が発生した可能性があります。`;
  }
  if(Object.prototype.hasOwnProperty.call(OTHER_BREAKDOWN_LABELS, metricKey)){
    if(!entry || !prevEntry) return null;
    const otherDiff = entry.other - prevEntry.other;
    const itemDiff = (entry.otherBreakdown?.[metricKey]||0) - (prevEntry.otherBreakdown?.[metricKey]||0);
    if(otherDiff === 0) return null;
    const share = Math.min(999, Math.abs(itemDiff / otherDiff * 100));
    return `その他経費全体の変動額（${otherDiff>=0?'+':''}${yen(otherDiff)}）のうち、この項目が約${share.toFixed(0)}%を占めています。`;
  }
  if(metricKey === 'sales' && allAlerts){
    const group = allAlerts.filter(a=>a.metricKey==='sales').sort((a,b)=>b.absChange-a.absChange);
    const rank = group.findIndex(a=>a===alert) + 1;
    if(rank && group.length){
      return `売上の変動幅は、アラート対象となった全${group.length}件中${rank}番目の大きさです。`;
    }
    return null;
  }
  return null;
}

function renderYoyTab(){
  const brandKey = state.yoy.brand;
  const month = state.yoy.month;
  const yoyMonth = '2025-' + month.split('-')[1];
  const brand = state.data[brandKey];
  const meta = BRAND_META[brandKey];

  const rows = brand.stores.map(store => {
    const cur = brand.data[store] ? brand.data[store][month] : null;
    const prev = (brand.yoy && brand.yoy[store]) ? brand.yoy[store][yoyMonth] : null;
    return { store, cur, prev };
  }).filter(r => r.cur);

  const withPrev = rows.filter(r => r.prev);
  const withoutPrev = rows.filter(r => !r.prev);
  withPrev.sort((a,b)=>{
    const dp = pctChange(computeProfit(a.cur), computeProfit(a.prev));
    const dq = pctChange(computeProfit(b.cur), computeProfit(b.prev));
    return (dp===null?0:dp) - (dq===null?0:dq);
  });

  const cell = (label, curVal, prevVal, isRatioMetric, isCostMetric) => {
    if(prevVal === null || prevVal === undefined || curVal === null || curVal === undefined){
      return `<td><span style="color:var(--text-dim);">—</span></td>`;
    }
    if(isRatioMetric){
      const diff = curVal - prevVal;
      const bad = isCostMetric ? diff > 0 : diff < 0;
      const color = Math.abs(diff) < 0.05 ? 'var(--text-dim)' : (bad ? 'var(--bad)' : 'var(--good)');
      return `<td>
        <div class="font-mono text-xs" style="color:var(--text-dim);">${prevVal.toFixed(1)}% → </div>
        <div class="font-mono">${curVal.toFixed(1)}%</div>
        <div class="text-xs" style="color:${color};">${pt(diff)}</div>
      </td>`;
    }
    const change = pctChange(curVal, prevVal);
    const bad = isCostMetric ? (change!==null && change>0) : (change!==null && change<0);
    const color = change===null ? 'var(--text-dim)' : (Math.abs(change)<1 ? 'var(--text-dim)' : (bad?'var(--bad)':'var(--good)'));
    return `<td>
      <div class="font-mono text-xs" style="color:var(--text-dim);">${yen(prevVal)} → </div>
      <div class="font-mono">${yen(curVal)}</div>
      <div class="text-xs" style="color:${color};">${change===null?'—':pct(change)}</div>
    </td>`;
  };

  const rowHtml = (r) => {
    const cur = r.cur, prev = r.prev;
    const profitCur = computeProfit(cur);
    const profitPrev = prev ? computeProfit(prev) : null;
    const foodRatioCur = cur.sales ? cur.food/cur.sales*100 : null;
    const foodRatioPrev = (prev && prev.sales) ? prev.food/prev.sales*100 : null;
    const laborRatioCur = cur.sales ? cur.labor/cur.sales*100 : null;
    const laborRatioPrev = (prev && prev.sales) ? prev.labor/prev.sales*100 : null;
    return `<tr>
      <td>${r.store}</td>
      ${cell('売上', cur.sales, prev?prev.sales:null, false, false)}
      ${cell('食材費率', foodRatioCur, foodRatioPrev, true, true)}
      ${cell('人件費率', laborRatioCur, laborRatioPrev, true, true)}
      ${cell('利益', profitCur, profitPrev, false, false)}
    </tr>`;
  };

  const tableRows = [...withPrev, ...withoutPrev].map(rowHtml).join('');

  return `
    <div class="fade-in">
      <div class="mb-6">
        <p class="text-xs uppercase tracking-widest" style="color:#3f6a8f;">Year-over-year</p>
        <h2 class="font-display text-3xl mt-1">前年同月比較</h2>
        <p class="text-sm mt-2" style="color:var(--text-dim);">昨年（2025年）と今年（2026年）の同じ月を比較します。データがある月は4月・5月のみです。</p>
      </div>

      <div class="flex items-center gap-3 flex-wrap mb-5">
        <div class="flex gap-2">
          <div class="pill ${brandKey==='CONA'?'selected-CONA':''}" data-action="yoy-brand" data-brand="CONA">CONA</div>
          <div class="pill ${brandKey==='NAPOLIMAN'?'selected-NAPOLIMAN':''}" data-action="yoy-brand" data-brand="NAPOLIMAN">ナポリマン</div>
        </div>
        <div class="flex gap-2">
          <div class="pill ${month==='2026-04'?'selected-CONA':''}" data-action="yoy-month" data-month="2026-04">2026年4月</div>
          <div class="pill ${month==='2026-05'?'selected-CONA':''}" data-action="yoy-month" data-month="2026-05">2026年5月</div>
          <div class="pill ${month==='2026-06'?'selected-CONA':''}" data-action="yoy-month" data-month="2026-06">2026年6月</div>
        </div>
      </div>

      <div class="surface rounded-xl p-5 overflow-x-auto">
        ${rows.length === 0 ? `<p class="text-sm" style="color:var(--text-dim);">この月のデータがありません。</p>` : `
        <table>
          <thead><tr><th style="text-align:left;">店舗</th><th>売上（前年→今年）</th><th>食材費率</th><th>人件費率</th><th>利益（前年→今年）</th></tr></thead>
          <tbody>${tableRows}</tbody>
        </table>
        ${withoutPrev.length ? `<p class="text-xs mt-3" style="color:var(--text-dim);">※ ${withoutPrev.map(r=>r.store).join('・')} は前年同月のデータがないため比較していません（新規開店店舗など）。</p>` : ''}
        `}
      </div>
    </div>`;
}

  const suppliesRatio = (eLatest.otherBreakdown && eLatest.sales) ? (eLatest.otherBreakdown.supplies / eLatest.sales * 100) : null;

  const row = (label, val, key) => {

        deltaHtml = `<span class="${bad ? 'down' : 'up'} font-mono">${pct(change)}</span> <span style="color:var(--text-dim);">前月比</span>`;
      }
    }
    return `
      <div class="flex items-center justify-between py-2" style="border-bottom:1px solid var(--line);">
        <span class="text-sm">${label}</span>
        <div class="text-right">
          <div class="font-mono text-sm">${yen(val)}</div>
          <div class="text-xs mt-0.5">${deltaHtml}</div>
        </div>
      </div>`;
  };

  const targetLine = (label, val, targetVal) => {
    if(val === null || targetVal === undefined || targetVal === null) return '';
    const diff = val - targetVal;
    const bad = diff > 0; // コスト比率は目標超過が悪化
    const badgeColor = Math.abs(diff) < 0.05 ? 'var(--text-dim)' : (bad ? 'var(--bad)' : 'var(--good)');
    return `
      <div class="flex items-center justify-between py-1.5">
        <span class="text-xs" style="color:var(--text-dim);">${label}（目標 ${targetVal.toFixed(1)}%）</span>
        <span class="text-xs font-mono">
          <span>${val.toFixed(1)}%</span>
          <span style="color:${badgeColor};">（${pt(diff)}）</span>
        </span>
      </div>`;
  };

  return `
    ${row('売上', eLatest.sales, 'sales')}
    ${row('食材費', eLatest.food, 'food')}
    ${row('人件費', eLatest.labor, 'labor')}
    ${row('家賃', eLatest.rent, 'rent')}
    ${row('その他経費', eLatest.other, 'other')}
    ${row('利益', profit, 'profit')}
    ${targets ? `
      <div class="mt-3 pt-2" style="border-top:1px dashed var(--line);">
        ${targetLine('食材費率', foodRatio, targets.food)}
        ${targetLine('人件費率', laborRatio, targets.labor)}
        ${targetLine('FL比率', flRatio, targets.fl)}
        ${targetLine('消耗品費率', suppliesRatio, targets.supplies)}
      </div>
    ` : `
      <div class="flex justify-between text-xs mt-3" style="color:var(--text-dim);">
        <span>食材費率：<span class="font-mono" style="color:var(--text);">${foodRatio!==null ? foodRatio.toFixed(1)+'%' : '—'}</span></span>
        <span>人件費率：<span class="font-mono" style="color:var(--text);">${laborRatio!==null ? laborRatio.toFixed(1)+'%' : '—'}</span></span>
      </div>
    `}`;
}

function renderComparisonTable(storeData, months, brandKey, storeName){
  if(!months.length){
    return `<p style="color:var(--text-dim);" class="text-sm">データがありません。</p>`;
  }
  const targets = getTargets(storeName);
  const rows = [
    { key:'sales', label:'売上' },
    { key:'food', label:'食材費' },
    { key:'foodRatio', label:'食材費率', targetKey:'food' },
    { key:'labor', label:'人件費' },
    { key:'laborRatio', label:'人件費率', targetKey:'labor' },
    { key:'flRatio', label:'FL比率', targetKey:'fl' },
    { key:'rent', label:'家賃' },
    { key:'other', label:'その他経費' },
    { key:'suppliesRatio', label:'消耗品費率', targetKey:'supplies' },
    { key:'profit', label:'利益' },
  ];

  const ratioValue = (entry, key) => {
    if(key === 'foodRatio') return entry.sales ? entry.food/entry.sales*100 : null;
    if(key === 'laborRatio') return entry.sales ? entry.labor/entry.sales*100 : null;
    if(key === 'flRatio') return entry.sales ? (entry.food+entry.labor)/entry.sales*100 : null;
    if(key === 'suppliesRatio') return (entry.otherBreakdown && entry.sales) ? entry.otherBreakdown.supplies/entry.sales*100 : null;
    return metricValue(entry, key);
  };

  const header = `<tr><th>項目</th>${months.map(m=>`<th>${monthLabel(m)}</th>`).join('')}<th></th></tr>`;

  const hasBreakdown = months.some(m => storeData[m].otherBreakdown);
  const breakdownRows = hasBreakdown ? Object.keys(OTHER_BREAKDOWN_LABELS).map(key => {
    const cells = months.map(m => {
      const bd = storeData[m].otherBreakdown;
      const v = bd ? bd[key] : null;
      return `<td><div class="font-mono text-xs" style="color:var(--text-dim);">${v!==null && v!==undefined ? yen(v) : '—'}</div></td>`;
    }).join('');
    return `<tr><td class="text-xs pl-4" style="color:var(--text-dim);">└ ${OTHER_BREAKDOWN_LABELS[key]}</td>${cells}<td></td></tr>`;
  }).join('') : '';

  const isRatio = (key) => key.endsWith('Ratio');

  const body = rows.map(r => {
    const cells = months.map((m, idx) => {
      const entry = storeData[m];
      const val = isRatio(r.key) ? ratioValue(entry, r.key) : metricValue(entry, r.key);
      const display = isRatio(r.key) ? (val !== null ? val.toFixed(1)+'%' : '—') : yen(val);

      let deltaBadge = '';
      if(idx > 0){
        const prevEntry = storeData[months[idx-1]];
        const prevVal = isRatio(r.key) ? ratioValue(prevEntry, r.key) : metricValue(prevEntry, r.key);
        if(val !== null && prevVal !== null){
          if(isRatio(r.key)){
            const diff = val - prevVal;
            const bad = diff > 0;
            deltaBadge = Math.abs(diff) >= 0.05 ? `<div class="text-xs ${bad?'down':'up'}">${pt(diff)}</div>` : '';
          } else {
            const isCost = COST_KEYS.includes(r.key);
            const change = pctChange(val, prevVal);
            if(change !== null){
              const bad = isCost ? change > 0 : change < 0;
              deltaBadge = `<div class="text-xs ${bad?'down':'up'}">${pct(change)}</div>`;
            }
          }
        }
      }
      // 最終月には目標比のズレを追加表示
      let targetBadge = '';
      if(idx === months.length - 1 && r.targetKey && targets && val !== null){
        const t = targets[r.targetKey];
        const diff = val - t;
        const bad = diff > 0;
        targetBadge = `<div class="text-xs mt-0.5" style="color:${Math.abs(diff)<0.05?'var(--text-dim)':(bad?'var(--bad)':'var(--good)')};">目標比 ${pt(diff)}</div>`;
      }
      return `<td><div class="font-mono">${display}</div>${deltaBadge}${targetBadge}</td>`;
    }).join('');
    const rowHtml = `<tr><td>${r.label}${r.targetKey && targets ? ` <span class="text-xs" style="color:var(--text-dim);">(目標${targets[r.targetKey]}%)</span>` : ''}</td>${cells}<td></td></tr>`;
    return r.key === 'other' ? rowHtml + breakdownRows : rowHtml;
  }).join('');

  return `<table><thead>${header}</thead><tbody>${body}</tbody></table>`;
}

/* ============================= 簡易シミュレーター ============================= */
function renderSimulator(brandKey, storeData, months, storeName){
  if(!months.length){
    return `<div class="surface rounded-xl p-6 text-center text-sm" style="color:var(--text-dim);">データがまだないため、シミュレーターは利用できません。</div>`;
  }
  return `
    <div class="surface rounded-xl p-5" id="simulator-box" data-brand="${brandKey}" data-store="${escapeAttr(storeName)}">
      <h3 class="font-semibold mb-1 text-sm" style="color:var(--text-dim);">簡易シミュレーター（${monthLabel(months[months.length-1])}実績ベース）</h3>
      <p class="text-xs mb-5" style="color:var(--text-dim);">売上・食材費率・人件費率を動かすと、利益への影響がリアルタイムに反映されます（家賃・その他経費は固定として計算）。</p>

      <div class="space-y-5">
        <div>
          <div class="flex justify-between text-xs mb-1.5">
            <span>売上の変化</span>
            <span id="sim-sales-val" class="font-mono font-semibold">±0.0%</span>
          </div>
          <input type="range" id="sim-sales" min="-20" max="20" step="0.5" value="0" class="sim-slider">
        </div>
        <div>
          <div class="flex justify-between text-xs mb-1.5">
            <span>食材費率の変化</span>
            <span id="sim-food-val" class="font-mono font-semibold">±0.0pt</span>
          </div>
          <input type="range" id="sim-food" min="-3" max="3" step="0.1" value="0" class="sim-slider">
        </div>
        <div>
          <div class="flex justify-between text-xs mb-1.5">
            <span>人件費率の変化</span>
            <span id="sim-labor-val" class="font-mono font-semibold">±0.0pt</span>
          </div>
          <input type="range" id="sim-labor" min="-3" max="3" step="0.1" value="0" class="sim-slider">
        </div>
      </div>

      <div id="sim-results" class="mt-6"></div>

      <button class="btn-ghost mt-4" data-action="sim-reset">条件をリセット</button>
    </div>`;
}

function getSimBaseline(brandKey, storeName){
  const brand = state.data[brandKey];
  const storeData = brand.data[storeName] || {};
  const months = sortedMonths(storeData);
  if(!months.length) return null;
  const entry = storeData[months[months.length - 1]];
  return {
    sales: entry.sales, food: entry.food, labor: entry.labor,
    rent: entry.rent, other: entry.other,
    foodRatio: entry.sales ? entry.food/entry.sales*100 : 0,
    laborRatio: entry.sales ? entry.labor/entry.sales*100 : 0,
  };
}

function updateSimResults(){
  const box = document.getElementById('simulator-box');
  if(!box) return;
  const brandKey = box.dataset.brand, storeName = box.dataset.store;
  const base = getSimBaseline(brandKey, storeName);
  if(!base) return;

  const salesDelta = Number(document.getElementById('sim-sales').value);
  const foodDeltaPt = Number(document.getElementById('sim-food').value);
  const laborDeltaPt = Number(document.getElementById('sim-labor').value);

  document.getElementById('sim-sales-val').textContent = pct(salesDelta, 1);
  document.getElementById('sim-food-val').textContent = pt(foodDeltaPt, 1);
  document.getElementById('sim-labor-val').textContent = pt(laborDeltaPt, 1);

  const profit0 = base.sales - base.food - base.labor - base.rent - base.other;

  const sales1 = base.sales * (1 + salesDelta/100);
  const foodRatio1 = Math.max(0, base.foodRatio + foodDeltaPt);
  const laborRatio1 = Math.max(0, base.laborRatio + laborDeltaPt);
  const food1 = sales1 * foodRatio1/100;
  const labor1 = sales1 * laborRatio1/100;
  const profit1 = sales1 - food1 - labor1 - base.rent - base.other;

  const deltaProfit = profit1 - profit0;
  const badgeColor = Math.abs(deltaProfit) < 1 ? 'var(--text-dim)' : (deltaProfit >= 0 ? 'var(--good)' : 'var(--bad)');

  const maxBar = Math.max(base.sales, sales1, 1);
  const bar = (label, before, after, color) => `
    <div class="mb-3">
      <div class="flex justify-between text-xs mb-1"><span style="color:var(--text-dim);">${label}</span></div>
      <div class="flex items-center gap-2 mb-1">
        <span class="text-xs w-10" style="color:var(--text-dim);">現在</span>
        <div class="flex-1 rounded-full overflow-hidden" style="background:var(--surface2); height:8px;">
          <div style="width:${(before/maxBar*100).toFixed(1)}%; background:${color}; height:8px; opacity:.45;"></div>
        </div>
        <span class="text-xs font-mono w-28 text-right">${yen(before)}</span>
      </div>
      <div class="flex items-center gap-2">
        <span class="text-xs w-10" style="color:var(--text-dim);">変更後</span>
        <div class="flex-1 rounded-full overflow-hidden" style="background:var(--surface2); height:8px;">
          <div style="width:${(after/maxBar*100).toFixed(1)}%; background:${color}; height:8px;"></div>
        </div>
        <span class="text-xs font-mono w-28 text-right font-semibold">${yen(after)}</span>
      </div>
    </div>`;

  document.getElementById('sim-results').innerHTML = `
    <div class="rounded-xl p-4 mb-4" style="background:var(--surface2);">
      <p class="text-xs mb-1" style="color:var(--text-dim);">利益の変化</p>
      <p class="font-display text-3xl" style="color:${badgeColor};">${deltaProfit >= 0 ? '+' : ''}${yen(deltaProfit)}</p>
      <p class="text-xs mt-1" style="color:var(--text-dim);">現在の利益 ${yen(profit0)} → 変更後の利益 ${yen(profit1)}</p>
    </div>
    ${bar('売上', base.sales, sales1, 'var(--gold)')}
    ${bar('利益', profit0, profit1, 'var(--good)')}
  `;
}

/* ============================= 描画統括 ============================= */
function render(){
  const root = document.getElementById('app-root');
  if(state.activeTab === 'overview'){
    root.innerHTML = renderOverview();
  } else if(state.activeTab === 'yoy'){
    root.innerHTML = renderYoyTab();
  } else {
    root.innerHTML = renderBrandTab(state.activeTab);
    requestAnimationFrame(()=> updateSimResults());
  }
  // タブのアクティブ表示更新
  document.querySelectorAll('#main-tabs .tab-btn').forEach(el=>{
    el.classList.toggle('active', el.dataset.brand === state.activeTab);
  });
}

function escapeAttr(s){
  return String(s).replace(/"/g,'&quot;');
}

/* ============================= イベント処理 ============================= */
document.addEventListener('click', (e)=>{
  const el = e.target.closest('[data-action]');
  if(!el) return;
  const action = el.dataset.action;

  if(action === 'switch-tab'){
    state.activeTab = el.dataset.brand;
    render();
  }
  else if(action === 'reset-data'){
    if(confirm('保存されている全データを削除して初期状態に戻します。よろしいですか？この操作は取り消せません。')){
      state.data = defaultData();
      saveData(state.data);
      for(const b of ['CONA','NAPOLIMAN']) state.selectedStore[b] = state.data[b].stores[0] || null;
      render();
    }
  }
  else if(action === 'sim-reset'){
    ['sim-sales','sim-food','sim-labor'].forEach(id=>{
      const el = document.getElementById(id);
      if(el) el.value = 0;
    });
    updateSimResults();
  }
  else if(action === 'yoy-brand'){
    state.yoy.brand = el.dataset.brand;
    render();
  }
  else if(action === 'yoy-month'){
    state.yoy.month = el.dataset.month;
    render();
  }
});

document.addEventListener('input', (e)=>{
  if(['sim-sales','sim-food','sim-labor'].includes(e.target.id)){
    updateSimResults();
  }
});

document.addEventListener('change', (e)=>{
  if(e.target.id === 'store-select'){
    state.selectedStore[e.target.dataset.brand] = e.target.value;
    render();
  }
});

/* ============================= 初期描画 ============================= */
render();
</script>
